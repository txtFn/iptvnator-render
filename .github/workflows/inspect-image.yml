
name: Inspect Custom IPTVnator Image

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build custom image
        run: docker build -t iptvnator-custom:test .

      - name: Verify backup dependencies
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            iptvnator-custom:test \
            -c '
              set -e
              python3 --version
              python3 -c "from cryptography.hazmat.primitives.ciphers.aead import AESGCM; print(\"Encryption: available\")"
              sqlite3 --version
              curl --version
              echo "Backup dependencies verified"
            '
