name: Test IPTVnator Automatic Restoration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iptvnator-remote-backup-test
  cancel-in-progress: false

jobs:
  test-auto-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t iptvnator-restore:test .

      - name: Prepare empty storage
        run: |
          mkdir -p restore-data
          chmod 777 restore-data

          test ! -f restore-data/databases/iptvnator.db

          echo "Empty storage verified"

      - name: Start fresh IPTVnator container
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          GITHUB_BACKUP_TOKEN: ${{ secrets.BACKUP_GITHUB_TOKEN }}
        run: |
          docker run -d \
            --name iptvnator-auto-restore \
            -p 127.0.0.1:10000:10000 \
            -e BACKUP_ENCRYPTION_KEY \
            -e GITHUB_BACKUP_TOKEN \
            -e BACKUP_TEST_MODE=1 \
            -e BACKUP_UPLOAD_ENABLED=0 \
            -e ALLOW_INITIAL_SETUP=0 \
            -v "$PWD/restore-data:/data" \
            iptvnator-restore:test

      - name: Wait for IPTVnator startup
        run: |
          for i in $(seq 1 40); do

            if curl -fsS --max-time 5 \
              http://localhost:10000/ \
              -o /dev/null; then

              echo "IPTVnator frontend is responding"
              exit 0
            fi

            if [ "$(docker inspect \
              -f '{{.State.Running}}' \
              iptvnator-auto-restore)" != "true" ]; then

              echo "Container stopped unexpectedly"
              exit 1
            fi

            sleep 5

          done

          echo "IPTVnator startup timed out"
          exit 1

      - name: Verify automatic restoration logs
        run: |
          docker logs iptvnator-auto-restore \
            > restore.log 2>&1

          grep -F "Downloading encrypted SQLite backup" \
            restore.log

          grep -F "SQLite database restored successfully" \
            restore.log

          grep -F "Automatic uploads disabled" \
            restore.log

          echo "PASS: Automatic restoration completed"

      - name: Verify restored database
        run: |
          docker exec iptvnator-auto-restore \
            ls -lh /data/databases/iptvnator.db

          RESULT=$(docker exec iptvnator-auto-restore \
            sqlite3 /data/databases/iptvnator.db \
            "PRAGMA integrity_check;")

          test "$RESULT" = "ok"

          echo "PASS: Database integrity verified"

      - name: Verify restored playlist
        run: |
          PLAYLIST=$(docker exec iptvnator-auto-restore \
            sqlite3 /data/databases/iptvnator.db \
            "SELECT name FROM playlists WHERE id='test-1';")

          test "$PLAYLIST" = "Modified Test Playlist"

          echo "Restored playlist: $PLAYLIST"
          echo "PASS: Latest playlist restored"

      - name: Verify restored large payload
        run: |
          COUNT=$(docker exec iptvnator-auto-restore \
            sqlite3 /data/databases/iptvnator.db \
            "SELECT COUNT(*) FROM test_payload;")

          test "$COUNT" = "1280"

          echo "Restored payload rows: $COUNT"
          echo "PASS: Large database payload restored"

      - name: Display memory usage
        run: |
          docker stats --no-stream \
            iptvnator-auto-restore

      - name: Confirm all restoration tests passed
        run: |
          echo "ALL AUTOMATIC RESTORATION TESTS PASSED"

      - name: Display container logs
        if: always()
        run: docker logs iptvnator-auto-restore || true

      - name: Cleanup
        if: always()
        run: docker rm -f iptvnator-auto-restore || true
